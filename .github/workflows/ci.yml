name: CI

on:
  push:
    branches:
      - main
      - 'milestone/*'
  pull_request:
  workflow_dispatch:

# A pull request's newer push cancels its older run. Every other run (each push to main and its release, a manual
# run) gets a group of its own, so a queued main push is never dropped and every passing main build is released.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Show commit and package versions
        run: |
          git rev-parse HEAD
          grep -i reactive src/Hymnal/Hymnal.csproj

      - name: Clear NuGet cache
        run: dotnet nuget locals all --clear

      - name: Restore
        run: dotnet restore Hymnal.slnx

      - name: Verify resolved ReactiveUI graph
        run: dotnet list src/Hymnal/Hymnal.csproj package --include-transitive | grep -iE 'reactiveui|splat'

      - name: Build
        run: dotnet build Hymnal.slnx --configuration Release --no-restore

      # Same filter as the documented local run (AGENTS.md / CLAUDE.md): GanttView_RowMoveShortcutHelper always
      # hangs, which left every unfiltered run stuck until it was cancelled. The hang timeout and the step
      # timeout turn any future stall into a failure instead of a run that never finishes.
      - name: Test
        timeout-minutes: 20
        run: >-
          dotnet test tests/Hymnal.Core.Tests/ --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName!~GanttView_RowMoveShortcutHelper"
          --blame-hang-timeout 90s

  # Every push to main that passes is released as v<major>.<minor>.<commits on main> (major.minor from
  # Directory.Build.props): self-contained win-x64 and linux-x64 builds, a zip, a tar.gz, a per-user setup.exe,
  # a .deb, latest.json and the install scripts, all described by hopelab-app.json. A manual run builds the
  # packages as workflow artifacts without publishing a release.
  release:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    uses: QuantumHope/MattEland.HopeLab.Shared/.github/workflows/app-release.yml@main
    with:
      publish: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
